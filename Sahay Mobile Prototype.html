<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sahay — WhatsApp-first customer journey prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F6F4EE; --surface:#FFFFFF; --ink:#12264A; --ink2:#3F4B63; --muted:#5E6679;
  --teal:#1F6B6B; --teal-bg:#E1EEEC; --blue-bg:#E4ECF4; --cream-bg:#F2EDDD;
  --rust:#A3452A; --rust-bg:#F7E6DD; --line:#D8D3C6; --focus:#1F6B6B; --unseen:#B9B3A4;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F1829; --surface:#16213A; --ink:#E7ECF5; --ink2:#C3CBDA; --muted:#9AA4B8;
    --teal:#74BDB5; --teal-bg:#18333A; --blue-bg:#1A2944; --cream-bg:#2A2818;
    --rust:#E39070; --rust-bg:#3A2219; --line:#2B3754; --focus:#74BDB5; --unseen:#5B6272;
  }
}
:root[data-theme="dark"]{
  --ground:#0F1829; --surface:#16213A; --ink:#E7ECF5; --ink2:#C3CBDA; --muted:#9AA4B8;
  --teal:#74BDB5; --teal-bg:#18333A; --blue-bg:#1A2944; --cream-bg:#2A2818;
  --rust:#E39070; --rust-bg:#3A2219; --line:#2B3754; --focus:#74BDB5; --unseen:#5B6272;
}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
a{color:var(--teal)}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.005em;margin:0}
p{margin:0}
.wrap{max-width:1360px;margin:0 auto;padding:0 20px}

/* top bar */
.top{background:var(--ground);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font-size:28px}
.brand span{color:var(--muted);font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.legend{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink2)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot.live{background:var(--teal)}
.dot.rep{border:2px solid var(--rust);background:transparent}
.dot.self{border:2px solid var(--muted);background:transparent;border-style:dashed}

/* layout */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-top:24px;padding-bottom:40px}
.rail{min-width:0}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;position:sticky;top:calc(16px + env(safe-area-inset-top,0px))}
.rail button{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:2px 10px;min-height:44px}
.rail button .n{grid-row:span 2;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.rail button .t{font-weight:600}
.rail button .s{font-size:13px;color:var(--muted);line-height:1.35}
.rail button[aria-current="step"]{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.rail button[aria-current="step"] .n{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.rail button.done .n{border-color:var(--teal);color:var(--teal)}
main{min-width:0}
.stephead{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.stephead .k{font-size:14px;color:var(--muted)}
.stephead h2{font-size:34px;line-height:1.15}
.stephead p{color:var(--ink2);max-width:72ch}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--ground)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}

/* blocks */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:20px}
.card.blue{background:var(--blue-bg);border-color:transparent}
.card.cream{background:var(--cream-bg);border-color:transparent}
.card.teal{background:var(--teal-bg);border-color:transparent}
.card.rust{background:var(--rust-bg);border-color:transparent}
.src{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.big{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--ink2);font-size:13.5px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
pre{margin:0;font-family:var(--mono);font-size:12.5px;line-height:1.45;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:320px}
details>summary{cursor:pointer;font-weight:600;min-height:32px}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:var(--mono);font-size:12.5px;background:var(--ground)}
select{border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;background:var(--surface)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600}
.tag.ok{background:var(--teal-bg);color:var(--teal)}
.tag.no{background:var(--rust-bg);color:var(--rust)}
.tag.neutral{background:var(--blue-bg);color:var(--ink2)}

/* consent timeline */
.timeline{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
.tl{flex:1 1 150px;padding:10px 12px;border-top:3px solid var(--line);color:var(--muted);font-size:14px}
.tl.on{border-top-color:var(--teal);color:var(--ink)}
.tl b{display:block;font-size:14.5px}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.pipe>div{padding:14px 16px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);position:relative}
.pipe>div:last-child{border-right:0;background:var(--ink);color:var(--ground)}
.pipe .h{font-weight:600;font-size:14px;color:var(--muted)}
.pipe>div:last-child .h{color:var(--ground);opacity:.8}
.pipe .v{font-family:var(--serif);font-size:22px;font-weight:700;line-height:1.2}
.chain{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.chain .c{flex:1 1 180px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14.5px}
.chain .c b{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.chain .arrow{align-self:center;color:var(--muted);font-size:18px}
.signals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.sig{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.sig .h{font-size:13.5px;font-weight:600;color:var(--muted)}
.sig .v{font-family:var(--serif);font-size:22px;font-weight:700}
.sig .d{font-size:14px;color:var(--ink2)}

/* ladder */
.flow3{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,.8fr);gap:16px}
.rung{display:grid;grid-template-columns:34px 1fr auto;gap:4px 10px;align-items:start;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.rung .rn{font-family:var(--serif);font-weight:700;font-size:22px;line-height:1;padding-top:2px}
.rung .nm{font-weight:600}
.rung .why{grid-column:2 / span 2;font-size:13.5px;color:var(--ink2)}
.rung.first{border:2px solid var(--rust);background:var(--rust-bg)}
.final{display:flex;flex-direction:column;gap:8px;justify-content:center;background:var(--ink);color:var(--ground);border-radius:12px;padding:18px}
.final .big{font-size:56px}
.check{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.check:last-child{border-bottom:0}
.assump{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 20px}
.assump label{display:flex;flex-direction:column;gap:4px;font-size:14px}
.assump output{font-weight:600}
input[type=range]{width:100%;accent-color:var(--teal);min-height:32px}

/* nudge */
.bsno{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.bsno>div{padding:14px 16px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.bsno>div:nth-child(2){background:var(--teal-bg)}
.bsno>div:last-child{border-right:0}
.bsno .h{font-weight:700;color:var(--teal);font-size:14px}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:16px}
.calc .term{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column}
.calc .term small{color:var(--muted);font-size:12.5px}
.calc .term b{font-family:var(--serif);font-size:22px}
.calc .op{font-family:var(--serif);font-size:24px;color:var(--muted)}
.calc .term.res{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.calc .term.res small{color:var(--ground);opacity:.8}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.opt .d{grid-column:1 / -1;font-size:14px;color:var(--ink2)}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
svg text{font-family:var(--sans)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:980px){
  .shell{grid-template-columns:1fr}
  .rail ol{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}
  .rail button{min-width:170px}
  .grid3,.signals,.flow3{grid-template-columns:1fr}
  .pipe,.bsno{grid-template-columns:1fr 1fr}
  .pipe>div:nth-child(2){border-right:0}
}
@media (max-width:620px){
  .grid2,.compare,.pipe,.bsno{grid-template-columns:1fr}
  .pipe>div,.bsno>div{border-right:0;border-bottom:1px solid var(--line)}
  .stephead h2{font-size:28px}
}
@media (prefers-reduced-motion:no-preference){
  .tl{transition:border-color .35s ease,color .35s ease}
}

.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:6px;font-size:14px;min-height:36px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--teal)}
.cue{border:1.5px dashed var(--muted);border-radius:10px;padding:10px 14px;margin-bottom:16px;background:var(--cream-bg);font-size:14.5px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;max-width:min(940px,94vw);width:100%;background:var(--ground);color:var(--ink)}
dialog::backdrop{background:rgba(10,20,40,.55)}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.capitem{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.capitem:first-of-type{border-top:0}
.acct{display:grid;grid-template-columns:24px 1fr auto;gap:4px 12px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.acct input{width:20px;height:20px;accent-color:var(--teal);margin-top:2px}
.acct .d{grid-column:2 / -1;font-size:13.5px;color:var(--muted)}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden}
.vs>div{padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.vs>div:first-child{background:var(--cream-bg)}
.vs>div:last-child{background:var(--teal-bg)}
.optbtn{width:100%;text-align:left;min-height:48px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.optbtn[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-bg);font-weight:600}
tr.on td:first-child{font-weight:700}
@media (max-width:620px){ .vs{grid-template-columns:1fr} }
</style>

<style id="wa-only-style">
/* WhatsApp-only presentation layer */
.top .brand span{font-size:13px}
.top .tools .chk{display:none}
.top .legend{display:none}
.shell{display:block;padding-top:12px}
.rail{display:none!important}
#main{max-width:1040px;margin:0 auto;min-height:780px}
.waStage{
  display:flex;justify-content:center;align-items:flex-start;gap:28px;
  padding:10px 8px 30px;
}
.waPhone{
  width:430px;height:790px;background:#101010;border-radius:44px;padding:10px;
  box-shadow:0 24px 60px rgba(10,35,55,.25),0 4px 16px rgba(0,0,0,.18);
  position:relative;flex:0 0 auto;
}
.waPhone:before{
  content:"";position:absolute;z-index:4;left:50%;top:9px;transform:translateX(-50%);
  width:122px;height:25px;border-radius:18px;background:#070707;
}
.waScreen{
  height:100%;border-radius:36px;overflow:hidden;background:#EDE7DF;
  display:flex;flex-direction:column;
}
.waStatus{
  height:29px;background:#075E54;color:#fff;display:flex;justify-content:space-between;align-items:center;
  padding:0 15px;font-size:10px;font-weight:700;
}
.waHead{
  height:66px;background:#075E54;color:#fff;display:flex;align-items:center;gap:9px;padding:8px 12px;
}
.waBack{font-size:22px;opacity:.9}
.waAvatar{
  width:42px;height:42px;border-radius:50%;background:#fff;color:#075E54;display:grid;place-items:center;
  font-weight:800;font-size:18px
}
.waMeta{min-width:0;flex:1}
.waName{font-size:16px;font-weight:800;line-height:1.1}
.waSub{font-size:11px;opacity:.85}
.waActions{font-size:17px;display:flex;gap:14px}
.waMessages{
  flex:1;overflow:auto;padding:14px 10px 16px;
  background:
   radial-gradient(circle at 18px 18px,rgba(0,0,0,.035) 1px,transparent 1.2px) 0 0/27px 27px,
   #EDE7DF;
}
.waDate{text-align:center;color:#6d7470;background:#e1dbd1;width:max-content;margin:4px auto 12px;padding:4px 9px;border-radius:8px;font-size:10px}
.waMsg{max-width:88%;margin:6px 0;display:flex;flex-direction:column}
.waMsg.in{align-self:flex-start}.waMsg.out{align-self:flex-end;align-items:flex-end}
.waBubble{
  background:#fff;border-radius:9px 9px 9px 2px;padding:9px 10px;
  box-shadow:0 1px 1px rgba(0,0,0,.12);font-size:13px;line-height:1.4;color:#233246;
}
.waMsg.out .waBubble{background:#DCF8C6;border-radius:9px 9px 2px 9px}
.waTime{font-size:9px;color:#7a837f;margin-top:2px;padding:0 4px}
.waQuick{
  background:#fff;border:1px solid #cbd6d2;color:#075E54;border-radius:18px;
  padding:7px 11px;font-size:12px;cursor:pointer;margin:4px 4px 0 0;
}
.waQuick:hover{background:#eef7f3}
.waQuick.primary{background:#128C7E;color:#fff;border-color:#128C7E}
.waCard{
  background:#fff;border:1px solid #d8ddd9;border-radius:10px;padding:10px 11px;
  margin-top:5px;
}
.waCard h3{font-family:var(--serif);font-size:17px;margin:0 0 7px;color:#17334e}
.waLine{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:5px 0;font-size:12px}
.waLine:last-child{border-bottom:0}
.waPill{display:inline-flex;align-items:center;gap:5px;background:#E4F3EE;color:#0C6F57;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:700}
.waWarn{background:#FFF4D8;color:#7d5e13;border-radius:8px;padding:8px 9px;font-size:11px;line-height:1.4;margin-top:7px}
.waPriority{background:#FFF1D0;border:1px solid #ecd29c;border-radius:9px;padding:10px;margin-top:7px}
.waPriority b{display:block;color:#7D5A0A;font-size:14px}
.waPriority span{color:#7f704d;font-size:11px}
.waBsno{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:1px solid #dce1dd;border-radius:9px;overflow:hidden;margin-top:6px}
.waBsno>div{padding:8px 7px;background:#fff;border-right:1px solid #e5e8e5}
.waBsno>div:nth-child(2){background:#E4F3EE}
.waBsno>div:last-child{border-right:0}
.waBsno b{display:block;font-size:10px;color:#0C6F57}
.waBsno span{font-size:10px;color:#56636f}
.waProgress{
  width:92px;height:92px;border-radius:50%;margin:6px auto 7px;
  border:11px solid #D9DFDA;border-right-color:#16A775;border-top-color:#16A775;
  display:grid;place-items:center;font-family:var(--serif);font-size:21px;font-weight:800;color:#17334e;
}
.waComposer{
  height:56px;background:#F4F2EF;border-top:1px solid #d5d0c8;padding:6px 7px;
  display:flex;align-items:center;gap:6px;
}
.waRound{border:0;background:transparent;color:#6c746e;font-size:19px;width:30px;cursor:pointer}
.waInput{height:40px;border:1px solid #ddd8d0;background:#fff;border-radius:22px;flex:1;display:flex;align-items:center;padding:0 13px;color:#a0a6a1;font-size:12px}
.waMic{width:39px;height:39px;border:0;border-radius:50%;background:#128C7E;color:#fff;cursor:pointer}
.waInfo{
  width:250px;background:#fff;border:1px solid #d6dfe5;border-radius:14px;padding:14px;
  box-shadow:0 12px 28px rgba(10,35,55,.10);position:sticky;top:16px;
}
.waInfo h3{margin:0 0 8px;font-family:var(--serif);font-size:21px;color:#17334e}
.waInfo .tiny{font-size:11px;color:#687786;line-height:1.45}
.waInfo .infoRow{padding:9px 0;border-top:1px solid #e8ebed;font-size:11px}
.waInfo .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.waInfo .live{background:#25D366}.waInfo .rep{background:#B96C4F}.waInfo .eng{background:#395E96}
.waInfo button{width:100%;margin-top:8px}
.waStageLabel{
  display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid #d6dfe5;
  border-radius:999px;padding:6px 10px;font-size:11px;color:#526474;margin-bottom:8px;
}
.waStageLabel b{color:#0B2B55}
.waTechDialogNote{font-size:11px;color:#697788;line-height:1.45}
@media(max-width:900px){
  .waStage{flex-direction:column;align-items:center}
  .waInfo{width:min(430px,100%);position:static}
}
@media(max-width:480px){
  #main{min-height:0}

        Transactions:{ Transaction:[{ txnId:"RDS001", type:"INSTALLMENT", amount:"1000.00", transactionDateTime:"2026-10-05T10:00:00+05:30", narration:"RD INSTALMENT FROM SB XXXX4821" }] } });
      const sb = accounts.find(a=>a.type==="DEPOSIT");
      sb.Summary.currentBalance = String(parseFloat(sb.Summary.currentBalance) - 1000);
      simNote = "Next fetch (1 Nov) finds a new recurring deposit: ₹1,000 on 5 Oct, earmarked for school fees.";
    } else if (key === "h2") {
      profile.health_cover.covers_all_members = true;
      profile.health_cover.gaps_reported = ["tests and medicines are paid by the family"];
      simNote = "The member confirms his child was added to the scheme card. Tests and medicines are still paid by the family.";
    } else {
      simNote = "Next fetch finds the usual RD instalment and no new early closure.";
    }
  }
  return { key, accounts, profile, asOf, simNote, id:h.id, all };
}

/* ---------- the engine ---------- */
function engine(H, th){
  const accts = H.accounts, prof = H.profile;
  const sb = accts.find(a=>a.type==="DEPOSIT");
  const tx = sb.Transactions.Transaction;
  let salaryTx = tx.filter(t=>t.type==="CREDIT" && t.narration.includes("SALARY"));
  if (!salaryTx.length) { const by={}; tx.filter(t=>t.type==="CREDIT").forEach(t=>{ const m=t.valueDate.slice(0,7); if(!by[m]||num(t)>num(by[m])) by[m]=t; }); salaryTx=Object.values(by); }
  const income = median(salaryTx.map(num));
  const salaryDay = mode(salaryTx.map(t=>+t.valueDate.slice(8,10)));
  const debits = tx.filter(t=>t.type==="DEBIT");
  const monthKeys = [...new Set(tx.map(t=>t.valueDate.slice(0,7)))].sort();
  const nM = monthKeys.length;
  const spend = debits.filter(t=>!OWN.some(o=>t.narration.includes(o)));
  const total = spend.reduce((s,t)=>s+num(t),0);
  const monthlySpend = total / nM;

  const payMonths = {};
  debits.forEach(t=>{ const p=payee(t.narration); if(p){ (payMonths[p]=payMonths[p]||new Set()).add(t.valueDate.slice(0,7)); }});
  const lenders = new Set(tx.filter(t=>t.type==="CREDIT" && t.narration.startsWith("UPI/CR/")).map(t=>t.narration.split("/")[2]));
  const family = new Set(Object.keys(payMonths).filter(p=>payMonths[p].size>=th.payeeMonths && !KNOWN.some(k=>p.includes(k)) && !lenders.has(p)));

  const isPerson = t => { const p=payee(t.narration); return p && !KNOWN.some(k=>t.narration.includes(k)); };
  const isCash = t => t.mode === "ATM";
  const cash = spend.filter(isCash).reduce((s,t)=>s+num(t),0);
  const toPeople = spend.filter(isPerson).reduce((s,t)=>s+num(t),0);
  const toFamily = spend.filter(t=>family.has(payee(t.narration))).reduce((s,t)=>s+num(t),0);

  const lumps = spend.filter(t=>num(t) >= th.lumpShare*income && INST.some(k=>t.narration.includes(k)));

  // recurring commitments: same counterparty in 10+ of the months
  const rc = {};
  debits.forEach(t=>{
    if (isPerson(t) && family.has(payee(t.narration))) return;
    let key = null;
    if (t.narration.startsWith("NACH/")) key = t.narration.split("/")[2] + (t.narration.includes("LOAN EMI")?"|loan EMI":"");
    else if (t.narration.startsWith("RD INSTALMENT")) key = "Recurring deposit";
    else if (payee(t.narration) && /RENT|PG|HOSTEL|BESCOM|RECHARGE/.test(t.narration)) key = payee(t.narration);
    if (!key) return;
    (rc[key]=rc[key]||{months:new Set(),amts:[]}); rc[key].months.add(t.valueDate.slice(0,7)); rc[key].amts.push(num(t));
  });
  const commitments = Object.entries(rc).filter(([k,v])=>v.months.size>=Math.min(10,nM-2)).map(([k,v])=>({ name:k, monthly:median(v.amts) }));

  // informal loan
  let loan = null;
  tx.forEach(t=>{
    if (t.type==="CREDIT" && t.narration.startsWith("UPI/CR/") && num(t) >= th.loanMinShare*income) {
      const who = t.narration.split("/")[2];
      const rep = debits.filter(d=>d.narration.includes(who) && d.valueDate > t.valueDate);
      if (rep.length >= 3) loan = { from:who, received:num(t), on:t.valueDate, payments:rep.length, monthly:num(rep[0]), repaid:rep.reduce((s,d)=>s+num(d),0) };
    }
  });
  const emi = debits.filter(t=>t.narration.startsWith("NACH") && t.narration.includes("LOAN EMI")).reduce((s,t)=>s+num(t),0) / nM;

  const earmarked = accts.filter(a=>a.type==="TERM_DEPOSIT"||a.type==="RECURRING_DEPOSIT").map(a=>({
    type:a.type, masked:a.maskedAccNumber, earmarkedFor:a.earmarkedFor||null,
    opening:a.Summary.openingDate||"2000-01-01", matures:a.Summary.maturityDate||"9999-12-31",
    maturityAmount:parseFloat(a.Summary.maturityAmount)||0, currentValue:parseFloat(a.Summary.currentValue)||0,
    recurring:a.Summary.recurringAmount?parseFloat(a.Summary.recurringAmount):0 }));
  const premature = tx.filter(t=>t.narration.includes("PREMATURE"));
  const bounces = tx.filter(t=>/RETURN|BOUNCE/.test(t.narration));
  const medical = debits.filter(t=>/PHARMACY|DIAGNOSTIC|MEDICINE/.test(t.narration)).reduce((s,t)=>s+num(t),0);
  const balance = parseFloat(sb.Summary.currentBalance);

  const series = monthKeys.map(m=>{
    const ms = spend.filter(t=>t.valueDate.startsWith(m));
    const unseen = ms.filter(t=>isCash(t)||isPerson(t)).reduce((s,t)=>s+num(t),0);
    const lump = ms.filter(t=>lumps.includes(t)).reduce((s,t)=>s+num(t),0);
    const tot = ms.reduce((s,t)=>s+num(t),0);
    return { m, seen:tot-unseen, unseen, lump, tot };
  });

  const sig = { income, salaryDay, nM, monthKeys, monthlySpend, total, cash, toPeople, toFamily, family:[...family],
    shareUnseen:(cash+toPeople)/total, shareCash:cash/total, sharePeople:toPeople/total, shareFamily:toFamily/total,
    lumps, commitments, loan, emiToIncome:emi/income, earmarked, premature, bounces, medical, balance, series,
    txCount:tx.length, accountCount:accts.length, from:tx[0].valueDate, to:tx[tx.length-1].valueDate };

  /* default ladder */
  const rungs = [];
  let season = null;
  if (bounces.length) rungs.push({ n:1, ok:false, why:`${bounces.length} payment(s) bounced in the last year.`, rule:"Any bounce fails rung 1." });
  else if (lumps.length) {
    const big = lumps.reduce((a,b)=>num(b)>num(a)?b:a);
    const [by,bm] = big.valueDate.split("-").map(Number);
    const next = `${by+1}-${String(bm).padStart(2,"0")}-01`;
    const fromFD = earmarked.filter(e=>e.type==="TERM_DEPOSIT" && e.matures < next).reduce((s,e)=>s+e.maturityAmount,0);
    const fromRD = earmarked.filter(e=>e.type==="RECURRING_DEPOSIT" && e.earmarkedFor).reduce((s,e)=>s+e.recurring*Math.max(0,monthsBetween(e.opening.slice(0,7), next.slice(0,7))),0);
    const covered = fromFD + fromRD, need = num(big), gap = Math.max(0, need-covered);
    const monthsLeft = monthsBetween(H.asOf.slice(0,7), next.slice(0,7));
    season = { need, big, next, fromFD, fromRD, covered, gap, monthsLeft };
    rungs.push({ n:1, ok:gap===0,
      why:`${INR(need)} to ${big.narration.split("/")[2]} on ${fmtDate(big.valueDate)} recurs by ${fmtMonth(next.slice(0,7))}. Set aside so far: ${INR(covered)}${gap?`; gap ${INR(gap)}`:"; fully covered"}.`,
      rule:`A single payment of ${pct(th.lumpShare)}+ of monthly income to a school or institution is a season expense.` });
  } else rungs.push({ n:1, ok:true, why:"No bounces, and no large institutional payment in the last 12 months.", rule:`Season expense = ${pct(th.lumpShare)}+ of monthly income to an institution.` });

  const hc = prof.health_cover;
  rungs.push({ n:2, ok:!!hc.covers_all_members,
    why:`${hc.source[0].toUpperCase()+hc.source.slice(1)}. ${hc.covers_all_members?"Covers every member.":"Does not cover every member."}${(hc.gaps_reported||[]).length?" Reported gap: "+hc.gaps_reported.join("; ")+".":""}`,
    rule:"Rung 2 clears when every household member has health cover (self-declared)." });

  const declared = prof.informal_debt_declared;
  let loanEst = null, debtOk;
  if (loan) {
    const ctx = (state.ctx[H.key]||{}).loanRate || "unconfirmed";
    if (ctx === "unconfirmed") loanEst = { ctx, outstanding:null };
    else {
      const r = ctx==="month" ? 0.03 : 0.03/12; let b = loan.received;
      for (let i=0;i<loan.payments;i++) b = b*(1+r) - loan.monthly;
      loanEst = { ctx, outstanding:Math.max(0,b), annual: ctx==="month" ? 0.36 : 0.03, monthlyRate:r };
    }
    debtOk = loanEst.outstanding !== null && loanEst.outstanding < 1 && sig.emiToIncome <= th.emiMax;
  } else debtOk = !declared && sig.emiToIncome <= th.emiMax;
  sig.loanEst = loanEst;
  rungs.push({ n:3, ok:debtOk,
    why: loan ? `${INR(loan.received)} received from a person on ${fmtDate(loan.on)}, then ${loan.payments} payments of ${INR(loan.monthly)} back. ` +
      (loanEst.outstanding===null ? "Whether anything is still owed depends on the rate, which isn't confirmed." : `At 3% a ${loanEst.ctx}, about ${INR(loanEst.outstanding)} is still owed.`)
      : `Loan EMIs are ${pct(sig.emiToIncome)} of income; no informal loan seen.`,
    rule:`Rung 3 fails above ${pct(th.emiMax)} EMI to income, or while an informal loan may still be owed.` });

  const target = th.bufferMonths * monthlySpend;
  const bufOk = balance >= target && premature.length===0;
  rungs.push({ n:4, ok:bufOk,
    why:`Savings balance ${INR(balance)} against a target of ${INR(target)}.${premature.length?` RD closed early on ${fmtDate(premature[0].valueDate)}.`:""}`,
    rule:`Target ${th.bufferMonths} months of spending, and no RD or FD broken early in the last 12 months.` });
  rungs.push({ n:5, ok:false, why:`Goals: ${prof.goals.length?prof.goals.join(", "):"none stated yet"}.`, rule:"Goals come once the lower rungs hold." });

  const defaultRung = rungs.find(r=>!r.ok).n;

  /* severity check */
  const projected = balance + income - monthlySpend;
  const checks = [
    { id:"bounce", label:"A payment bounced in the last 60 days", hit: bounces.some(t=>monthsBetween(t.valueDate.slice(0,7), H.asOf.slice(0,7))<=2), to:1 },
    { id:"shortfall", label:`Money runs out before next month (balance + income − usual spend = ${INR(projected)})`, hit: projected < 0, to:1 },
    { id:"costly", label:"Confirmed informal loan costing 2%+ a month, still owed", hit: !!(loanEst && loanEst.outstanding>0 && loanEst.monthlyRate>=th.severeMonthlyRate), to:3 },
  ];
  let finalRung = defaultRung, override = null;
  for (const c of checks) if (c.hit && c.to !== defaultRung && (c.to < defaultRung || c.id==="costly")) { finalRung = c.to; override = c; break; }

  return { sig, season, rungs, defaultRung, checks, finalRung, override, target };
}

/* ---------- nudges and actions ---------- */
function nudge(H, E){
  const s = E.sig, p = H.profile;
  if (E.finalRung === 1 && E.season) {
    const S = E.season, raw = S.gap / Math.max(1,S.monthsLeft), per = Math.ceil(raw/100)*100;
    const half = Math.round(per/2/100)*100, short = Math.max(0, S.gap - half*S.monthsLeft);
    const fd = s.earmarked.find(e=>e.type==="TERM_DEPOSIT" && e.matures < S.next);
    return { head:"Start a school-fee RD this month",
      because:`Last ${MONTH[+S.big.valueDate.slice(5,7)-1]}, school fees took ${INR(S.need)} at once.${fd?` Your FD matures on ${fmtDate(fd.matures)} with about ${INR(fd.maturityAmount)}.`:""}`,
      so:`Put ${INR(per)} a month into an RD from now. With the FD, next ${MONTH[+S.next.slice(5,7)-1]}'s fees are covered.`,
      now:`Salary has just arrived on the ${ord(s.salaryDay)}. Starting now gives ${S.monthsLeft} months.`,
      or:`Start at ${INR(half)} a month; ${MONTH[+S.next.slice(5,7)-1]} would be about ${INR(short)} short. Or do nothing now, and we remind you in April.`,
      calc:{ need:S.need, provision:S.covered, provisionLabel: fd ? `FD maturing ${fmtDate(fd.matures)}` : "set aside so far", gap:S.gap, months:S.monthsLeft, raw, per } };
  }
  if (E.finalRung === 2) {
    const perM = Math.ceil(s.medical/12/50)*50;
    return { head:"Close the gaps in your family's health cover",
      because:`Your family's scheme card pays for hospital stays, but ${INR(s.medical)} went on tests and medicines in the last year${p.health_cover.covers_all_members?"":", and not every member is on the card"}.`,
      so:`${p.health_cover.covers_all_members?"":"Ask at the scheme's enrolment centre whether your child can be added. "}For medicines, government Jan Aushadhi shops usually cost less than private chemists.`,
      now:`Setting aside ${INR(perM)} a month from the salary on the ${ord(s.salaryDay)} would cover a year like the last one.`,
      or:"Do nothing for now; we check again after next month's salary.", calc:null };
  }
  if (E.finalRung === 3 && s.loan) {
    const L = s.loan, est = s.loanEst;
    return { head: est.outstanding===null ? "Tell us one thing about your loan" : "See what your loan really costs",
      because:`You received ${INR(L.received)} from a person on ${fmtDate(L.on)} and have paid back ${INR(L.repaid)} in ${L.payments} payments.`,
      so: est.outstanding===null ? "Tell us whether the 3% is per month or per year. That single answer tells us how much is still owed." :
        `At 3% a ${est.ctx}, that is roughly ${Math.round(est.annual*100)}% a year, and about ${INR(est.outstanding)} is still owed. Before borrowing again, ask the partner bank what a regulated loan would cost, so you can compare.`,
      now:`Your salary arrives on the ${ord(s.salaryDay)}.`,
      or:"Keep repaying as you are; we check again next month.", calc:null };
  }
  if (E.finalRung === 4) {
    const broke = s.premature.length>0;
    return { head: broke ? "Keep your RD growing through the next emergency" : "Build a buffer for surprises",
      because: broke ? `On ${fmtDate(s.premature[0].valueDate)}, your RD was closed early to cover a hospital bill; closing early cost some interest.` :
        `Your savings balance is ${INR(s.balance)}, below ${E.target?INR(E.target):""} (${state.th.bufferMonths} months of your usual spending).`,
      so: broke ? "Build a small cash buffer so the RD isn't the first thing you reach for. If an emergency comes first, ask your bank which option disturbs your savings least." :
        "Keep a little more in savings each month until the buffer is there.",
      now:`You have ${INR(s.balance)} in savings; the prototype target is ${INR(E.target)}.`,
      or:"Keep things as they are; we check again next month.", calc:null };
  }
  return { head:"Plan your next goal", because:`The lower rungs hold. Your stated goal: ${H.profile.goals.join(", ")||"none yet"}.`,
    so:"Talk it through with a licensed adviser through the partner bank.", now:"", or:"", calc:null };
}
function actions(rung){
  const A = {
    1:[["Open the RD yourself in your bank app","Free"],["Open it at the Post Office, if you save there","Free"],["Let the partner bank set it up for you","Regulated partner"],["Talk to a person","Free"]],
    2:[["Ask at the scheme enrolment centre about adding your child","Free, public"],["Use a Jan Aushadhi shop for medicines","Free, public"],["See health cover options from a licensed partner","Regulated partner"],["Talk to a person","Free"]],
    3:[["Answer one question about the loan's rate","Free"],["Compare a regulated loan's cost at the partner bank","Regulated partner"],["Talk to a person","Free"]],
    4:[["Keep a small buffer in your savings account","Free"],["Ask the bank which liquidity option disturbs savings least","Regulated partner"],["Talk to a person","Free"]],
    5:[["Write the goal down with a date","Free"],["Talk to a licensed adviser through the partner bank","Regulated partner"]],
  };
  return A[rung]||[];
}

function chart(s){
  const W=720,Hh=230,pad=28,bw=(W-pad*2)/s.series.length, max=Math.max(...s.series.map(x=>x.tot));
  const y=v=>(Hh-60)*(v/max);
  let g="";
  s.series.forEach((x,i)=>{
    const bx=pad+i*bw+6, w=bw-12, hSeen=y(x.seen), hUn=y(x.unseen), base=Hh-26;
    g+=`<rect x="${bx}" y="${base-hSeen}" width="${w}" height="${hSeen}" fill="var(--teal)" rx="2"></rect>`;
    g+=`<rect x="${bx}" y="${base-hSeen-hUn}" width="${w}" height="${hUn}" fill="var(--unseen)" rx="2"></rect>`;
    if (x.lump) g+=`<rect x="${bx-2}" y="${base-hSeen-hUn-2}" width="${w+4}" height="${hSeen+hUn+4}" fill="none" stroke="var(--rust)" stroke-width="2.5" rx="3"></rect><text x="${bx+w/2}" y="${base-hSeen-hUn-8}" text-anchor="middle" font-size="12" font-weight="600" fill="var(--rust)">${INR(x.lump)}</text>`;
    g+=`<text x="${bx+w/2}" y="${Hh-8}" text-anchor="middle" font-size="12" fill="var(--muted)">${MON[+x.m.slice(5)-1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img" aria-label="Money going out each month. Teal is spending Sahay can explain; grey is cash and transfers to people. Outlined months contain a season expense.">${g}</svg>
  <div style="display:flex;gap:16px;flex-wrap:wrap" class="small"><span class="src"><span class="dot" style="background:var(--teal)"></span>Spending Sahay can explain</span><span class="src"><span class="dot" style="background:var(--unseen)"></span>Cash and transfers to people</span><span class="src"><span class="dot" style="border:2px solid var(--rust)"></span>Season expense</span></div>`;
}
function chainFor(H,E){
  const s=E.sig;
  if (E.season) return [["Data signal",`${INR(E.season.need)} to a school on ${fmtDate(E.season.big.valueDate)}`],["Interpretation",`Recurring seasonal obligation detected, due again by ${fmtMonth(E.season.next.slice(0,7))}`],["Pressure",E.season.gap?`Upcoming liquidity pressure: set aside so far covers ${pct(E.season.covered/E.season.need)}; gap ${INR(E.season.gap)}`:"Fully covered"],["Rung",`${E.rungs[0].ok?"Rung 1 clear":"Rung 1"}`]];
  if (H.key==="h2") return [["Data signal",`${INR(s.medical)} on tests and medicines; ${pct(s.shareFamily)} of spending sent home`],["Interpretation","Health costs outside the scheme card; household depends on one income"],["Pressure",H.profile.health_cover.covers_all_members?"Every member now carded; medicines still out of pocket":"Not every member is covered"],["Rung",`Rung ${E.finalRung}`]];
  return [["Data signal",s.premature.length?`RD closed early on ${fmtDate(s.premature[0].valueDate)}`:"No early closures"],["Interpretation","Liquidity fragility: long-term savings were used as the emergency fund"],["Pressure",`Balance ${INR(s.balance)} against a ${INR(E.target)} buffer target`],["Rung",`Rung ${E.finalRung}`]];
}
function vUnderstand(H){

  const E=engine(H,state.th), s=E.sig, p=H.profile;
  const commits = s.commitments.map(c=>{ const [nm,tag]=c.name.split("|"); return `${nm.toLowerCase().replace(/\b\w/g,m=>m.toUpperCase())}${tag?" ("+tag+")":""} ${INR(c.monthly)}`; }).join(" · ")||"None found";
  const lumpTxt = s.lumps.length ? s.lumps.map(t=>`${INR(num(t))} in ${MON[+t.valueDate.slice(5,7)-1]}`).join(", ") : "None";
  const debtTxt = s.loan ? `Informal loan: ${INR(s.loan.received)} from a person` : `EMIs ${pct(s.emiToIncome)} of income`;
  const ctx = H.key==="h2" ? `<label class="small" style="display:flex;flex-direction:column;gap:6px">Is the loan's 3% per month or per year?
      <select id="loanRate"><option value="unconfirmed" ${state.ctx.h2.loanRate==="unconfirmed"?"selected":""}>Not confirmed yet</option><option value="month" ${state.ctx.h2.loanRate==="month"?"selected":""}>Per month</option><option value="year" ${state.ctx.h2.loanRate==="year"?"selected":""}>Per year</option></select></label>` : `<p class="small">Nothing extra needed for this household right now.</p>`;
  return head("Raw data becomes a household profile", "The engine reads every transaction and derives six signals. Nothing on this screen is typed in by hand.") +
  `<div class="pipe">
    <div><span class="h">Raw data</span><span class="v">${s.txCount} transactions</span><span class="small">${s.accountCount} account(s), ${s.nM} months</span></div>

    <div><span class="h">Priority</span><span class="v">Rung ${E.finalRung}</span><span class="small">${RUNGS[E.finalRung]}</span></div>
  </div>
  <div class="signals" style="margin-top:16px">
    <div class="sig"><span class="h">Income</span><span class="v">${INR(s.income)}</span><span class="d">Median salary credit, around the ${ord(s.salaryDay)}</span></div>
    <div class="sig"><span class="h">Recurring commitments</span><span class="v">${s.commitments.length}</span><span class="d">${esc(commits)}</span></div>

    <div class="sig"><span class="h">Buffer</span><span class="v">${INR(s.balance)}</span><span class="d">Target ${INR(E.target)} (${state.th.bufferMonths} months of spending)${s.premature.length?"; RD broken early":""}</span></div>
    <div class="sig"><span class="h">Unexplained flows</span><span class="v">${pct(s.shareUnseen)}</span><span class="d">Cash ${pct(s.shareCash)}, transfers to people ${pct(s.sharePeople)}</span></div>
  </div>
  <section class="card" style="margin-top:16px"><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><h3>The money year</h3>${REP}</div>${chart(s)}</section>
  <section style="margin-top:16px"><h3 style="font-size:20px;margin-bottom:10px">How the engine reads it</h3>
    <div class="chain">${chainFor(H,E).map((c,i,a)=>`<div class="c"><b>${c[0]}</b>${esc(c[1])}</div>${i<a.length-1?'<span class="arrow" aria-hidden="true">→</span>':""}`).join("")}</div></section>
  ${ctxHTML}

const MASK_KEYS=/(msisdn|imsi|uan|accountnumber|bankrrn|mobile|aadhaar|pan)$/i;
function maskD(v,key){
  if(Array.isArray(v)) return v.map(x=>maskD(x,key));
  if(v&&typeof v==="object"){ const o={}; Object.keys(v).forEach(k=>o[k]=maskD(v[k],k)); return o; }
  if(typeof v==="string"&&key&&MASK_KEYS.test(key)) return "X".repeat(Math.max(0,v.length-4))+v.slice(-4);
  return v;
}
function interpret(api, r){
  try{
    if(api==="Mobile Authentication"){
      const x=r.result||{}, ok=x.isValid===true && x.subscriberStatus==="CONNECTED";
      return { ok, text: ok ? "The network confirms the number is valid and connected. Sahay keeps only that yes, not the operator or subscriber identifiers. Connection type came back empty, so Sahay does not use it."
                            : "The number could not be confirmed as active, so Sahay would send nothing to it and would ask the member for another number." };
    }
    if(api==="Silent Bank Account Verification"){
      const src=((r.result||{}).data||{}).source, s=Array.isArray(src)?src[0]:null;
      if(!s) return { ok:null, text:"The response has no source block to read." };
      const d=s.data||{}, flags=(((r.result||{}).comparisonData||{}).inputVsSource||{}).flags||{};
      if(s.isValid===true){
        if(flags.accountHolderName===true) return { ok:true, text:"The bank confirms the account exists and the name matches the holder." };
        if(flags.accountHolderName===false) return { ok:false, text:"The account exists but the name does not match. Sahay would not send a consent request for it." };
        return { ok:true, text:"The bank confirms the account exists; the name was not compared." };
      }
      return { ok:null, text:`Not verified. The bank replied "${d.bankResponse||"no reason given"}" (code ${d.statusCode||"none"}), so Sahay treats it as "not checked", not as "not yours". The API's own status of ${r.statusCode} only says the call was processed; Sahay reads isValid.` };
    }
    if(api==="Name Similarity"){
      const x=r.result||{};
      return { ok:x.result===true, text:`The names ${x.result===true?"match":"do not match"} (score ${x.score}).` };
    }
    if(api==="EPF UAN Lookup"){
      const u=(r.result||{}).uan, n=Array.isArray(u)?u.length:(u?1:0);
      return { ok:n>0, text:n?`A UAN is linked to this number (${n} found), so the member has been in formal PF employment at some point. It doesn't show current employment, and Sahay doesn't keep the number.`:"No UAN is linked to this number, so Sahay records nothing about formal employment." };
    }

}

/* ---------- live AA import ---------- */
function parseAA(txt){
  let j; try{ j=JSON.parse(txt); }catch(e){ throw new Error("That isn't valid JSON. Paste the whole decrypted FI response, including the outer braces."); }
  const out=[];
  const visit=(o,fip)=>{
    if(!o||typeof o!=="object") return;
    if(Array.isArray(o)){ o.forEach(x=>visit(x,fip)); return; }
    const f=o.fipID?{id:o.fipID,name:o.fipName||o.fipID}:fip;
    if(o.Summary && (o.Transactions!==undefined || o.type)){ const a=JSON.parse(JSON.stringify(o)); a.fip=a.fip||f||{name:"Institution"}; out.push(a); return; }
    ["FI","data","decryptedFI","Account"].forEach(k=>{ if(o[k]) visit(o[k],f); });
  };
  visit(j);
  if(!out.length) throw new Error("No decrypted accounts found. Paste the decrypted FI data: the part that has Summary and Transactions for each account.");
  out.forEach((a,i)=>{
    a.type=String(a.type||"").toUpperCase().replace(/[- ]/g,"_");
    a.maskedAccNumber=a.maskedAccNumber||("XXXX"+(1000+i));
    const tr=a.Transactions&&a.Transactions.Transaction;
    if(Array.isArray(tr)){
      tr.forEach(t=>{ t.type=String(t.type||"").toUpperCase(); t.mode=String(t.mode||"").toUpperCase(); t.narration=String(t.narration||"");
        t.valueDate=String(t.valueDate||t.transactionTimestamp||t.transactionDateTime||"").slice(0,10); t.amount=String(t.amount); });
      tr.sort((x,y)=>x.valueDate<y.valueDate?-1:x.valueDate>y.valueDate?1:0);
    }
  });
  const sb=out.find(a=>a.type==="DEPOSIT");
  if(!sb) throw new Error("Need at least one savings account (type DEPOSIT) with its transactions.");
  const tx=sb.Transactions&&sb.Transactions.Transaction;
  if(!Array.isArray(tx)||tx.length<20) throw new Error("The savings account needs about a year of transactions. Found "+(Array.isArray(tx)?tx.length:0)+".");
  if(!sb.Summary||sb.Summary.currentBalance===undefined) throw new Error("The savings account is missing Summary.currentBalance.");
  return out;
}

  }
  if (t.id==="resetConsent"){ resetHousehold(state.hh); render(); return; }
  if (t.id==="sim"){ state.sim[state.hh]=true; render(); return; }
  if (t.id==="unsim"){ state.sim[state.hh]=false; render(); return; }

  }

  if (t.dataset.unav){ const a=APIS[+t.dataset.unav].api; if(state.unavail[a]) delete state.unavail[a]; else state.unavail[a]=true; saveCap(); capDialog(); render(); return; }
  if (t.id==="capRestore"){ const b=JSON.parse(JSON.stringify(DATA.bundle||{})); state.captured=b.captured||{}; state.fail=b.fail||{}; state.unavail=b.unavail||{}; saveCap(); capDialog(); render(); return; }

  if (t.id==="aaUse"){
    const msg=document.getElementById("aaMsg"), k=document.getElementById("aaHh").value;
    try{ state.live[k]=parseAA(document.getElementById("aaTxt").value); saveLive(); resetHousehold(k); state.share[k]={}; capDialog(); render(); document.getElementById("aaMsg").textContent="Loaded for "+NAMES[k]+". Consent for that household was reset so it runs on the new data."; }
    catch(err){ msg.textContent=err.message; }
    return;
  }
  if (t.id==="aaBack"){ const k=document.getElementById("aaHh").value; delete state.live[k]; saveLive(); resetHousehold(k); capDialog(); render(); return; }
});
document.addEventListener("input", e=>{
  const el=e.target;
  if (el.dataset && el.dataset.th){
    state.th[el.dataset.th]=parseFloat(el.value);
    keepScroll(render);
    const again=document.querySelector(`[data-th="${el.dataset.th}"]`); if(again) again.focus();
  }
});
document.addEventListener("change", e=>{
  const el=e.target;
  if (el.id==="loanRate"){ state.ctx.h2.loanRate=el.value; keepScroll(render); }
  if (el.id==="cues"){ state.cues=el.checked; keepScroll(render); }
  if (el.dataset && el.dataset.share){ (state.share[state.hh]=state.share[state.hh]||{})[el.dataset.share]=el.checked; keepScroll(render); }
});
document.addEventListener("keydown", e=>{
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || $("#cap").open) return;
  if (e.key==="ArrowRight") go(state.step+1);
  if (e.key==="ArrowLeft") go(state.step-1);
});

/* ---------- WhatsApp-only customer flow ---------- */
state.waTiming = state.waTiming || {};
state.waExpanded = state.waExpanded || false;
state.waVoice = state.waVoice || false;

function waTime(){ return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
function waMsg(text, type="in", extra=""){
  return `<div class="waMsg ${type}"><div class="waBubble">${text}${extra}</div><div class="waTime">${waTime()}${type==="out"?" ✓✓":""}</div></div>`;
}
function waQuick(label, action, primary=false){
  return `<button type="button" class="waQuick ${primary?"primary":""}" data-wa="${action}">${label}</button>`;
}
function waCard(inner){ return `<div class="waCard">${inner}</div>`; }
function waStageName(){
  return ["Arrive","One question","Consent","Understand","Identify","Intervene","Act"][state.step] || "Arrive";
}
function waStatusLine(){
  const live = APIS.filter(a=>apiState(a.api)==="captured").length;
  const fail = APIS.filter(a=>apiState(a.api)==="failonly").length;
  const unavail = APIS.filter(a=>apiState(a.api)==="unavailable").length;
  return `<div class="waPill">Sahay engine active</div>
    <div style="margin-top:7px;font-size:10px;color:#617080">
      Perfios: ${live} live capture${live===1?"":"s"} · ${fail} failure capture · ${unavail} sandbox-limited
    </div>`;
}

function waVerification(H){
  const items=[];
  const mobile=state.captured["Mobile Authentication"];
  const name=state.captured["Name Similarity"];
  const uan=state.captured["EPF UAN Lookup"];
  if(mobile) items.push(`<div class="waLine"><span>Mobile</span><b>✓ connected · Perfios</b></div>`);
  if(name && H.key==="h2") items.push(`<div class="waLine"><span>Name match</span><b>✓ matched · Perfios</b></div>`);
  if(uan && H.key==="h3") items.push(`<div class="waLine"><span>Employment context</span><b>✓ UAN found · Perfios</b></div>`);
  items.push(`<div class="waLine"><span>Bank ownership</span><b>○ sandbox-limited</b></div>`);
  items.push(`<div class="waLine"><span>AA financial history</span><b>Representative / authorised</b></div>`);
  return waCard(`<h3>Secure checks</h3>${items.join("")}
    <div class="waWarn">WhatsApp explains the journey. Anumati/AA remains the financial-data consent and access rail.</div>`);
}

function waProfile(H,E){
  const s=E.sig, p=H.profile;
  const season=s.lumps.length?s.lumps.map(t=>`${INR(num(t))} in ${MON[+t.valueDate.slice(5,7)-1]}`).join(", "):"None found";
  const commitments=s.commitments.length?s.commitments.slice(0,3).map(c=>c.name.split("|")[0]).join(" · "):"None found";
  return waCard(`<h3>What I understood</h3>
    <div class="waLine"><span>Income pattern</span><b>${INR(s.income)} / month</b></div>
    <div class="waLine"><span>Regular commitments</span><b>${esc(commitments)}</b></div>
    <div class="waLine"><span>Savings & deposits</span><b>${INR(s.balance)}</b></div>
    <div class="waLine"><span>Upcoming / seasonal signal</span><b>${esc(season)}</b></div>
    <div class="waLine"><span>Household context</span><b>${p.members} people · ${p.earners} earner</b></div>`);
}

function waPriority(H,E){
  const N=nudge(H,E);
  const why=E.finalRung===1
    ? "A known seasonal expense is arriving before the household has fully provisioned for it."
    : E.finalRung===2
    ? "Protection exposure is more immediate than the family's longer-term goals."
    : E.finalRung===4
    ? "Emergency liquidity is the next unmet need; long-term savings are already being used for shocks."
    : E.finalRung===3
    ? "Borrowing pressure needs attention before longer-term goals."
    : "Long-term goals become relevant after the more immediate rungs are cleared.";
  return waCard(`<h3>Your current priority</h3>
    <div class="waPriority"><b>Rung ${E.finalRung} — ${RUNGS[E.finalRung]}</b><span>${esc(why)}</span></div>
    ${state.waExpanded ? `<div class="waBsno">
      <div><b>Default</b><span>lowest unmet rung</span></div>
      <div><b>Severity</b><span>material risk can override</span></div>
      <div><b>Final</b><span>one priority</span></div>
      <div><b>Action</b><span>one next step</span></div>
    </div>`:""}
    ${waQuick(state.waExpanded?"Hide reasoning":"Why this?","why")}`);
}

function waIntervention(H,E){
  const N=nudge(H,E);
  const opts=actions(E.finalRung);
  const plan=N.so || opts[0]?.[0] || "Continue the recommended action";
  const orText=opts[1]?.[0] || "Explore another lower-disruption option";
  return waCard(`<h3>Your next step</h3>
    <div class="waLine"><span><b>Because</b></span><b style="text-align:right">${esc(N.because)}</b></div>
    <div class="waLine"><span><b>So</b></span><b style="text-align:right">${esc(N.so || plan)}</b></div>
    <div class="waLine"><span><b>Now</b></span><b style="text-align:right">${esc(N.now)}</b></div>
    <div class="waLine"><span><b>Or</b></span><b style="text-align:right">${esc(orText)}</b></div>
    <div class="waPriority"><b>${esc(plan)}</b><span>${E.finalRung===1?"Plan backwards from the known seasonal expense.":E.finalRung===2?"Review the protection gap before the next health expense.":"Preserve long-term savings; explore the lowest-disruption liquidity option."}</span></div>`);
}

function waRender(){
  renderTop();
  $("#main").innerHTML = `
    <div class="waStage">
      <div>
        <div class="waStageLabel"><b>${waStageName()}</b><span>· continuous WhatsApp conversation</span></div>
        <div class="waPhone">
          <div class="waScreen">
            <div class="waStatus"><span>9:41</span><span>▴ ◉ ▰</span></div>
            <div class="waHead">
              <div class="waBack">‹</div>
              <div class="waAvatar">S</div>
              <div class="waMeta"><div class="waName">Sahay ✓</div><div class="waSub">online · financial wellness</div></div>
              <div class="waActions"><span>⌕</span><span>⋮</span></div>
            </div>
            <div class="waMessages" id="waMessages"></div>
            <div class="waComposer"><button class="waRound">＋</button><div class="waInput">Message</div><button class="waRound">◉</button><button class="waMic">●</button></div>
          </div>
        </div>
      </div>
      <aside class="waInfo">
        <h3>Behind the chat</h3>
        <div class="tiny">Presenter controls stay outside the customer conversation. Use the household selector above, and the sandbox capture button when needed.</div>
        <div class="infoRow"><span class="dot live"></span><b>Perfios</b><br><span class="tiny">Verification/context layer</span></div>
        <div class="infoRow"><span class="dot rep"></span><b>Anumati / AA</b><br><span class="tiny">Representative financial-data flow until live access is confirmed.</span></div>
        <div class="infoRow"><span class="dot eng"></span><b>Sahay engine</b><br><span class="tiny">Same engine: signals → priority → next action.</span></div>
        <div style="margin-top:10px">${waStatusLine()}</div>
      </aside>
    </div>`;

  const H=household(state.hh), E=engine(H,state.th), p=H.profile, A=ANS[state.one[H.key]||"school"];
  const msgs=[];
  msgs.push(`<div class="waDate">Today</div>`);

  // ARRIVE
  msgs.push(waMsg(`Namaste ${p.lang==="or"?"🙏":"👋"} ${H.key==="h1"?"Lakshman":H.key==="h2"?"Abhi":"Liquid"}.<br><b>I’m Sahay.</b><br><br>I can help you plan for the financial season already coming — right here on WhatsApp.<br><br><b>What would you like help with today?</b>
    <div style="margin-top:5px">${waQuick("School fees","goal-school",state.one[H.key]==="school")}${waQuick("Medical expense","goal-medical",state.one[H.key]==="medical")}${waQuick("Emergency savings","goal-surprise",state.one[H.key]==="surprise")}${waQuick("Festival / family","goal-festival",state.one[H.key]==="festival")}</div>`));
  if(H.key==="h2"){
    msgs.push(waMsg(`<b>🎙️ You can also reply with a voice note in ${esc(LANGS[p.language]||"your language")}.</b><br><span style="font-size:11px;color:#637">WhatsApp keeps the interaction lightweight.</span>`));
  }

  // ONE QUESTION
  if(state.step>=1){
    msgs.push(waMsg(esc(Q.find(x=>x[0]===state.one[H.key])?.[1]||"Your upcoming expense"),"out"));
    msgs.push(waMsg(`<b>One quick question:</b><br>When do you expect this expense?`));
    if(!state.waTiming[H.key]){
      msgs.push(`<div class="waMsg in"><div class="waBubble">${waQuick("Within 1 month","timing-1")}${waQuick("2–3 months","timing-2")}${waQuick("4–6 months","timing-3",true)}${waQuick("I'm not sure","timing-0")}</div></div>`);
    }else{
      msgs.push(waMsg(state.waTiming[H.key],"out"));
      msgs.push(waMsg(`<b>That’s helpful 👍</b><br>${esc(A.head)}<br><br>${esc(A.body)}<br><br><span style="font-size:11px;color:#667">You haven’t shared any bank data yet.</span>`));
      msgs.push(`<div class="waMsg in"><div class="waBubble">${waQuick("See what sharing would improve","to-consent",true)}${waQuick("Not now","not-now")}</div></div>`);
    }
  }

  // CONSENT
  if(state.step>=2){
    msgs.push(waMsg(`<b>If you want a more personalised answer, I can use your consented financial information.</b><br><br>I’ll explain exactly what is requested before anything moves.`));
    msgs.push(`<div class="waMsg in"><div class="waBubble"><div class="waCard">
      <h3>Share financial data securely</h3>
      <div class="waLine"><span>Accounts</span><b>Savings · FD · RD</b></div>
      <div class="waLine"><span>History</span><b>Last 12 months</b></div>
      <div class="waLine"><span>Frequency</span><b>Once a month</b></div>
      <div class="waLine"><span>Data life</span><b>6 months</b></div>
      <div class="waLine"><span>Purpose</span><b>Personal financial management</b></div>
      ${state.consent[H.key]>=3?`<div class="waPill" style="margin-top:7px">✓ Approved in Anumati</div>`:`${waQuick("Continue to Anumati","consent",true)}${waQuick("Not now","not-now")}`}
    </div></div></div>`);
  }

  // UNDERSTAND
  if(state.step>=3 && state.consent[H.key]>=3){
    msgs.push(waMsg(`<b>Anumati approved ✅</b><br>Your consent has been recorded. I’ll now use only the permitted financial information for this purpose.`));
    msgs.push(waMsg(waVerification(H)));
    msgs.push(waMsg(`<b>I’ve analysed your authorised financial picture.</b><br>I’ll show you what matters in simple terms — not a transaction dump.`));
    msgs.push(`<div class="waMsg in"><div class="waBubble">${waQuick("Show what Sahay understood","understand",true)}</div></div>`);
  }

  // IDENTIFY
  if(state.step>=4){
    msgs.push(waMsg(waProfile(H,E)));
    msgs.push(waMsg(`<b>I don’t show you everything I found.</b><br>I use those signals to decide what matters first.`));
    msgs.push(`<div class="waMsg in"><div class="waBubble">${waQuick("Show my priority","priority",true)}</div></div>`);
  }
  if(state.step>=5){
    msgs.push(waMsg(waPriority(H,E)));
    msgs.push(`<div class="waMsg in"><div class="waBubble">${waQuick("Show my next step","intervene",true)}</div></div>`);
  }

  // INTERVENE
  if(state.step>=6){
    msgs.push(waMsg(waIntervention(H,E)));
    msgs.push(`<div class="waMsg in"><div class="waBubble">${waQuick("Start plan","start-plan",true)}${waQuick("Explore alternatives","alternatives")}</div></div>`);
  }

  // ACT
  if(state.step>=7){
    msgs.push(waMsg(`<b>Done ✅</b><br>Your plan is active. I’ll check again next month while your consent remains valid.`));
    const prog = state.sim[H.key] ? 80 : 60;
    msgs.push(waMsg(waCard(`<h3>Your progress</h3><div class="waProgress">${prog}%</div><div class="waLine"><span>Current priority</span><b>Rung ${E.finalRung}</b></div><div class="waLine"><span>Next check</span><b>Next month</b></div><div class="waLine"><span>Consent</span><b>Valid while approved</b></div>`)));
    if(state.sim[H.key]){
      msgs.push(waMsg(`<b>Next month 🔄</b><br>I re-checked the latest authorised data. ${E.finalRung===1?"The seasonal priority remains active.":"The priority will update if the household context changes."}`));
    }
    msgs.push(`<div class="waMsg in"><div class="waBubble">${waQuick("Simulate next month","simulate")}${waQuick("Pause plan","pause")}${waQuick("STOP","stop")}${waQuick("Continue in Sahay app →","app",true)}</div></div>`);
  }

  $("#waMessages").innerHTML=msgs.join("");
  const m=$("#waMessages"); m.scrollTop=m.scrollHeight;
}

/* Replace the dashboard render with the WhatsApp-only customer experience. */
render = waRender;

/* WhatsApp interaction handler; it uses separate data attributes so the legacy dashboard handlers do not interfere. */
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-wa]");
  if(!t) return;
  const a=t.dataset.wa, k=state.hh;

  if(a.startsWith("goal-")){
    const map={"goal-school":"school","goal-medical":"medical","goal-surprise":"surprise","goal-festival":"festival"};
    state.one[k]=map[a]||state.one[k];
    state.skip[k]=false;
    state.step=1;
    render();
    return;
  }
  if(a.startsWith("timing-")){
    const map={"timing-1":"Within 1 month","timing-2":"2–3 months","timing-3":"4–6 months","timing-0":"I’m not sure"};
    state.waTiming[k]=map[a];
    state.step=1;
    render();
    return;
  }
  if(a==="to-consent"){
    state.step=2;
    render();
    return;
  }
  if(a==="not-now"){
    state.skip[k]=true;
    return;
  }
  if(a==="consent"){
    if(state.consent[k]===0){
      state.consent[k]=1;
      render();
      setTimeout(()=>{ state.consent[k]=3; if(state.hh===k){ state.step=3; render(); } },900);
    }
    return;
  }
  if(a==="understand"){ state.step=4; render(); return; }
  if(a==="priority"){ state.step=5; render(); return; }
  if(a==="why"){ state.waExpanded=!state.waExpanded; render(); return; }
  if(a==="intervene"){ state.step=6; render(); return; }
  if(a==="start-plan"){ state.step=7; render(); return; }
  if(a==="alternatives"){ render(); return; }
  if(a==="simulate"){ state.sim[k]=true; render(); return; }
  if(a==="pause"){ state.sim[k]=false; render(); return; }
  if(a==="stop"){ state.sim[k]=false; state.consent[k]=0; render(); return; }
  if(a==="app"){
    alert("Demo hand-off: the same Sahay decision engine continues in the standalone app.");
    return;
  }
});

state.step=0;
render();

})();
</script>
